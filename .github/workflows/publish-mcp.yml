name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3.8.0
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity-regexp "https://github.com/modelcontextprotocol/registry/.github/workflows/.*" \
            --certificate-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive"
          chmod +x mcp-publisher
      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate and publish server.json
        run: |
          ./mcp-publisher validate
          ./mcp-publisher publish
